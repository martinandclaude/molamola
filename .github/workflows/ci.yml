name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Pinned: an unpinned `pip install ruff` picked up the 0.16 series,
      # whose wider default rule set failed every push from v0.6.0 on
      # while local lint (0.15) passed. Bump deliberately, together with
      # the dev extra and environment.yml.
      - run: pip install ruff==0.16.9
      - run: ruff check molamola/ tests/ scripts/

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime + test deps (pip-only, no conda)
        run: |
          pip install --upgrade pip
          pip install matplotlib numpy pandas biopython pycirclize pytest
      - name: Run tests
        run: pytest -v
